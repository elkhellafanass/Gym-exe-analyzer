# =====================================================================
# Gym-exe-analyzer : configuration centrale
# Outil pédagogique d'aide à l'analyse technique.
# Ce n'est PAS un dispositif médical. Aucune prédiction de blessure.
# =====================================================================

app:
  name: "Gym-exe-analyzer"
  disclaimer: "Outil pédagogique d'aide à l'analyse technique. Ce n'est pas un dispositif médical et il ne prédit aucune blessure."

dataset:
  # Dossier local du dataset, relatif à la racine du projet (data/ n'est jamais versionné).
  # Pour pointer ailleurs sans modifier ce fichier : variable d'environnement SQUAT_DATA_DIR.
  squat_dir: "data/squat"
  env_var: "SQUAT_DATA_DIR"
  # Nom de fichier attendu : subject_<ID>_squat_<good|bad>_<front|side|diagonal>.mp4
  filename_pattern: '^subject_(?P<subject>\d{3})_(?P<exercise>[a-z]+)_(?P<quality>good|bad)_(?P<view>front|side|diagonal)\.mp4$'
  index_csv: "data/index.csv"
  own_videos_dir: "data/own"
  citation: >-
    Sai Prashanth, Duddela; Kamath, Priya; Bhandary, Rakshith; Pai, S Ashlesh;
    PN, Pratham; P, Advith; Mashetty, Abhishek (2026), "A Multi-View Raw Video
    Dataset of Seven Fitness Exercises with Good/Bad Form Labels",
    Mendeley Data, V2, doi: 10.17632/kgbb3yn47p.2
  url: "https://data.mendeley.com/datasets/kgbb3yn47p/2"
  license: "CC BY 4.0"
  license_url: "https://creativecommons.org/licenses/by/4.0/"
  accessed: "2026-10-12"

# ---------------------------------------------------------------------
# Paramètres techniques du pipeline (PAS des critères de posture).
# Choix d'ingénierie, documentés dans docs/SOURCES.md section "Paramètres techniques".
# ---------------------------------------------------------------------
pose:
  model_path: "models/pose_landmarker_full.task"
  model_url: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task"
  max_people: 3            # personnes détectées max ; on garde la plus grande (la plus proche)
  min_visibility: 0.5      # en dessous, le point est considéré absent (NaN)
  max_gap_frames: 3        # trous comblés par interpolation (3 images = 0,2 s à 15 fps)
  smooth_window: 7         # lissage Savitzky-Golay (7 images = 0,47 s à 15 fps)
  smooth_polyorder: 2

reps:
  min_travel: 0.3          # descente minimale de la hanche, en longueurs de cuisse
  min_interval_s: 0.8      # temps minimal entre deux points bas
  edge_fraction: 0.1       # début/fin du mouvement = à 10 % de l'amplitude depuis le haut

# ---------------------------------------------------------------------
# Exercices. Architecture prévue pour en ajouter d'autres (non fait).
#
# Chaque règle :
#   indicator : colonne calculée par src/angles.py
#   window    : "rep" (toute la répétition) ou "bottom_half" (moitié basse du mouvement)
#   agg       : max ou min de l'indicateur sur la fenêtre
#   reference : (optionnel) "start" = mesure relative à la posture debout du début de la répétition
#   op, value : erreur si  agg(indicateur) <op> value
#   views     : vues où l'indicateur est interprétable ; "reduced" = fiabilité réduite (signalé)
#   source    : clé dans docs/SOURCES.md
#   status    : "sourcé" | "critère sourcé, seuil à valider par un expert" | "à valider par un expert"
# ---------------------------------------------------------------------
exercises:
  squat:
    label: "Squat"
    # Myer et al. 2014 : un défaut est retenu s'il apparaît sur 2 répétitions ou plus.
    min_reps_for_video_error: 2
    min_reps_source: "myer2014"
    rules:
      depth:
        label: "Profondeur insuffisante"
        indicator: depth
        window: rep
        agg: max
        op: "<"
        value: 0.0
        views: {valid: [side], reduced: []}
        source: myer2014
        status: "sourcé"
        message: "Au point bas, la hanche reste au-dessus du genou. Critère : articulation de la hanche au moins au niveau du genou (cuisses au moins parallèles au sol)."
      heel_rise:
        label: "Talons décollés"
        indicator: heel_height
        reference: start
        window: rep
        agg: max
        op: ">"
        value: 0.15
        views: {valid: [side], reduced: []}
        source: myer2014
        status: "critère sourcé, seuil à valider par un expert"
        message: "Le talon monte par rapport à sa position debout en début de répétition. Critère : le pied entier reste en contact avec le sol. La tolérance (15 % de la longueur du pied) absorbe le bruit de mesure et n'est pas sourcée."
      trunk_vs_tibia:
        label: "Tronc trop penché par rapport au tibia"
        indicator: trunk_minus_tibia
        window: bottom_half
        agg: max
        op: ">"
        value: 15.0
        views: {valid: [side], reduced: []}
        source: myer2014
        status: "critère sourcé, seuil à valider par un expert"
        message: "Le tronc est nettement plus penché que le tibia. Critère : tronc parallèle au tibia. La tolérance de 15° n'est pas sourcée."
      head_position:
        label: "Tête / cou penchés vers l'avant"
        indicator: neck_lean
        reference: start
        window: bottom_half
        agg: max
        op: ">"
        value: 30.0
        views: {valid: [side], reduced: []}
        source: myer2014
        status: "critère sourcé, seuil à valider par un expert"
        message: "Le cou s'incline vers l'avant par rapport à la posture debout (tête baissée ou projetée). Critère : ligne du cou perpendiculaire au sol. Mesure relative à la posture debout (compense le décalage oreille/épaule des points MediaPipe). La tolérance de 30° n'est pas sourcée."
      knee_valgus:
        label: "Genoux vers l'intérieur (valgus)"
        indicator: knee_ankle_ratio
        window: bottom_half
        agg: min
        op: "<"
        value: 1.0
        views: {valid: [front], reduced: [diagonal]}
        source: myer2014
        status: "critère sourcé, seuil à valider par un expert"
        message: "Les genoux se rapprochent plus que les chevilles. Critère : le genou ne doit pas passer à l'intérieur de la cheville. Approximation : centres genou/cheville (ratio de Mizner 2012 < 1)."
      hip_shift:
        label: "Bassin qui bascule (asymétrie)"
        indicator: hip_tilt
        window: bottom_half
        agg: max
        op: ">"
        value: 10.0
        views: {valid: [front], reduced: [diagonal]}
        source: myer2014
        status: "critère sourcé, seuil à valider par un expert"
        message: "La ligne des hanches n'est pas horizontale vue de face. Critère : hanches parallèles au sol. La tolérance de 10° n'est pas sourcée."
    # Indicateurs affichés sans règle (pas de seuil fiable)
    info_only:
      tempo: "Rapport descente/remontée affiché, sans règle : le critère de tempo de Myer et al. (2014) est formulé de façon ambiguë, et 15 fps limite la précision."
      knee_asymmetry: "Différence d'angle de genou gauche/droite (projection 2D), affichée sans seuil."

# ---------------------------------------------------------------------
# Évaluation et classifieur (phase B). Valeurs FIXÉES AVANT tout résultat
# (protocole committé avant la première exécution), jamais réglées ensuite.
# Ce sont des choix d'ingénierie, pas des critères de posture.
# ---------------------------------------------------------------------
evaluation:
  # Modèle utilisé par l'app : régression logistique (choisie d'avance pour son
  # explicabilité). La forêt aléatoire sert seulement de comparaison.
  app_model: logreg
  logreg: {C: 1.0, max_iter: 1000}
  random_forest: {n_estimators: 500, min_samples_leaf: 3, random_state: 42}
  # Probabilité "bad" dans cette zone -> verdict "incertain". Largeur non optimisée.
  uncertain_zone: [0.35, 0.65]
  bootstrap: {n: 2000, seed: 42}       # rééchantillonnage des SUJETS
  permutation: {n: 1000, seed: 42}     # test de permutation (régression logistique)
  calibration_bins: 5                  # courbe de fiabilité (5 groupes de 30 vidéos)

# ---------------------------------------------------------------------
# Jeux de données externes (validation externe). Jamais commités (data/ est
# ignoré par git). Racine surchargeable par EXTERNAL_DATA_DIR.
# Attribution complète : docs/DATA_LICENSES.md
# ---------------------------------------------------------------------
external:
  root: "data/external"
  env_var: "EXTERNAL_DATA_DIR"
  # Planches d'inspection (images de personnes) : dans data/ (ignoré) ou hors du dépôt
  inspection_dir: "data/inspection"
  teng_squat:
    dir: "A_teng_squat"
    citation: "Teng, Christopher (2025). Squat Dataset [Data set]. Zenodo. https://doi.org/10.5281/zenodo.17558630"
    doi: "10.5281/zenodo.17558630"
    license: "CC BY 4.0"
    accessed: "2026-10-13"
  dai_squat:
    # Version UTILISÉE pour l'évaluation : v2 (13/04/2026, 35 sujets annoncés).
    dir: "B_dai_squat_v2"
    citation: "Dai, Zhiqiang (2026). Dataset for: Non-standard Squat Posture Detection Method Using Human Skeleton [Data set]. Zenodo. https://doi.org/10.5281/zenodo.19550070"
    doi: "10.5281/zenodo.19550070"
    license: "CC BY 4.0"
    accessed: "2026-10-13"
    # Version précédente (04/03/2026), gardée pour comparaison seulement.
    v1:
      dir: "B_dai_squat"
      doi: "10.5281/zenodo.18859797"

# ---------------------------------------------------------------------
# Références citées dans l'app et dans le rapport (détail : docs/SOURCES.md)
# ---------------------------------------------------------------------
sources:
  myer2014:
    short: "Myer et al., 2014"
    citation: "Myer GD, Kushner AM, et al. (2014). The back squat: a proposed assessment of functional deficits and technical factors that limit performance. Strength and Conditioning Journal, 36(6), 4-27."
    url: "https://doi.org/10.1519/SSC.0000000000000103"
  mizner2012:
    short: "Mizner et al., 2012"
    citation: "Mizner RL, Chmielewski TL, Toepke JJ, Tofte KB (2012). Comparison of 2-dimensional measurement techniques for predicting knee angle and moment during a drop vertical jump."
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC3340567"

# ---------------------------------------------------------------------
# Résumé de fiabilité de chaque règle, affiché dans l'app à côté des chiffres
# de docs/results/rule_reliability.csv. C'est une LECTURE des résultats de la
# phase B et de la validation externe (docs/PIPELINE.md), pas un nouveau calcul.
# level : "la mieux validée" | "peu informative" | "dépend du format" | "non évaluée"
# ---------------------------------------------------------------------
reliability_summary:
  depth:
    level: "la mieux validée"
    text: "Seule règle avec un résultat concluant hors du dataset d'origine : 4,7 % de fausses alertes sur des squats « standard » (Dai 2026, 28 sujets), quel que soit le format d'image. Attention : elle signale 92 % des vidéos « good » du dataset Mendeley, dont les squats ne descendent souvent pas jusqu'à la parallèle."
  heel_rise:
    level: "peu informative"
    text: "Mesure du talon peu fiable à ces résolutions : sur Mendeley, elle signale autant de vidéos sans défaut visible (79 %) qu'avec (75 %) ; sur Dai, 35 à 67 % de fausses alertes selon le format d'image supposé."
  trunk_vs_tibia:
    level: "peu informative"
    text: "Aucun accord avec l'annotation sur Mendeley (kappa 0,05). Elle signale, à titre indicatif, les dos très penchés mis en scène (Teng 2025), mais ses fausses alertes dépendent du format d'image (Dai : 9 à 44 %)."
  head_position:
    level: "peu informative"
    text: "Peu de fausses alertes, mais elle manque environ 3 défauts de tête sur 4 vus par l'annotateur (Mendeley). Fausses alertes faibles sur Dai (2 %), qui varient un peu selon le format."
  knee_valgus:
    level: "non évaluée"
    text: "Aucune annotation de face : seulement les taux de signalement sur les vidéos good et bad de Mendeley (face : 16 % contre 28 %). Fiabilité non évaluée."
  hip_shift:
    level: "non évaluée"
    text: "Aucune annotation de face : seulement les taux de signalement sur Mendeley (face : 0 % contre 16 % ; diagonale : 75 % contre 84 %). Fiabilité non évaluée."
